<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#F2F4F6">
<title>가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F6;--card:#FFFFFF;--ink:#191F28;--ink2:#333D4B;--sub:#4E5968;--mute:#6B7684;--faint:#8B95A1;--line:#E5E8EB;--line2:#D1D6DB;--blue:#3268F0;--blue2:#1F4FC7;--green:#0F7B55;--warn:#8A4B00;--warnbg:#FFF4E6;--red:#C92A2A;--sat:#1971C2;--sun:#D6336C;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}
.view{padding:calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 120px);display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:20px;padding:18px 20px}
.row{display:flex;align-items:center}
.muted{color:var(--mute)}
.h1{margin:0;font-size:24px;font-weight:800}
.h2{margin:0;font-size:16px;font-weight:700}
.big{font-size:32px;font-weight:800;letter-spacing:-.5px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0;border-radius:22px}
.ico{width:40px;height:40px;flex-shrink:0;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:20px}
.txrow{border:0;background:transparent;text-align:left;width:100%;display:flex;align-items:center;gap:12px;padding:10px 0}
.txmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txname{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txmeta{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px}
.amt{font-size:15px;font-weight:700;white-space:nowrap}
.chip{flex-shrink:0;height:32px;padding:0 10px;border-radius:16px;font-size:13px;border:1px solid var(--line2);background:#fff;color:var(--ink2);font-weight:500}
.chip.on{border:0;background:var(--ink);color:#fff;font-weight:700}
.chip.warn{border:1px solid #FFC078;background:var(--warnbg);color:var(--warn);font-weight:700}
.chip.warn.on{border:0;background:var(--ink);color:#fff}
.chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;height:calc(62px + var(--safe-b));padding-bottom:var(--safe-b);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:20}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mute)}
.nav button.on{color:var(--ink);font-weight:700}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(var(--safe-b) + 80px);width:56px;height:56px;border-radius:28px;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(25,31,40,.18);z-index:15}
.pillwrap{position:fixed;left:50%;transform:translateX(-50%);top:0;width:100%;max-width:480px;z-index:12;padding:calc(var(--safe-t) + 12px) 12px 14px;background:linear-gradient(to bottom,var(--bg) 0%,var(--bg) 55%,rgba(242,244,246,0) 100%);display:flex;flex-direction:column;gap:8px;pointer-events:none}
.pill{display:flex;align-items:center;gap:4px;height:52px;padding:0 4px 0 8px;border-radius:26px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 1px 3px rgba(25,31,40,.06);transition:box-shadow .2s;pointer-events:auto}
.scrolled .pill,.scrolled .searchbar{box-shadow:0 6px 20px rgba(25,31,40,.14)}
.ymbtn{height:40px;padding:0 10px;border:0;border-radius:20px;background:transparent;font-size:17px;font-weight:800}
.ymbtn.on{background:var(--bg)}
.searchbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:24px;background:rgba(255,255,255,.95);box-shadow:0 1px 3px rgba(25,31,40,.06);pointer-events:auto}
.searchbar input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:16px;color:var(--ink)}
.picker{pointer-events:auto;margin:0 4px;padding:12px;border-radius:22px;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 28px rgba(25,31,40,.16);display:flex;flex-direction:column;gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mgrid button{height:44px;border:0;border-radius:14px;font-size:15px;background:var(--bg);font-weight:500}
.mgrid button.on{background:var(--ink);color:#fff;font-weight:800}
.mgrid button.future{color:#ADB5BD}
.cal{background:#fff;border-radius:20px;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calhead{font-size:12px;text-align:center;color:var(--mute)}
.day{height:46px;border:0;border-radius:10px;padding:6px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;background:transparent}
.day .n{display:block;height:18px;line-height:18px;font-size:13px;font-weight:500}
.day .a{display:block;height:12px;line-height:12px;font-size:10px;color:var(--sub)}
.day.today{background:var(--bg)}
.day.sel{background:var(--line)}
.day.today .n,.day.sel .n{font-weight:800}
.seg{display:flex;gap:2px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{height:30px;padding:0 12px;border:0;border-radius:8px;font-size:12px;background:transparent;color:var(--mute);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(25,31,40,.12)}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 2px}
.grouphead span:first-child{font-size:13px;font-weight:700;color:var(--sub)}
.grouphead span:last-child{font-size:13px;color:var(--mute)}
.issue{background:var(--warnbg);border-radius:18px;padding:12px 16px 6px;display:flex;flex-direction:column}
.issue button{border:0;background:transparent;color:var(--warn);text-align:left;display:flex;align-items:center;gap:12px;padding:10px 0}
.issue button+button{border-top:1px solid #FFE0B8}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:4px}
.scrim{position:fixed;inset:0;background:rgba(25,31,40,.45);z-index:30;animation:fade .15s}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:24px 24px 0 0;padding:12px 20px calc(var(--safe-b) + 24px);z-index:31;display:flex;flex-direction:column;gap:16px;animation:up .2s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);align-self:center;flex-shrink:0}
.infobox{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:14px;background:#F8F9FA;font-size:14px}
.infobox>div{display:flex;justify-content:space-between;gap:12px}
.infobox>div>span:first-child{color:var(--sub);flex-shrink:0}
.lbl{font-size:13px;font-weight:700;color:var(--sub)}
.kinds{display:grid;gap:6px}
.kinds button{height:44px;border-radius:12px;font-size:14px;border:1px solid var(--line2);background:#fff;color:var(--sub);font-weight:500}
.kinds button.on{border:1.5px solid var(--ink);background:#F8F9FA;color:var(--ink);font-weight:700}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{height:36px;padding:0 12px;border-radius:18px;font-size:13px;display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;font-weight:500}
.cats button.on{border:1.5px solid var(--blue);background:#E8EFFE;font-weight:700}
.assetbtn{height:52px;border-radius:14px;font-size:15px;display:flex;align-items:center;gap:10px;padding:0 14px;text-align:left;border:1px solid var(--line);background:#fff;font-weight:500;width:100%}
.assetbtn.on{border:1.5px solid var(--blue);background:#E8EFFE;font-weight:700}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--ink2);padding:4px 2px 0}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--blue);flex-shrink:0}
.primary{height:54px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;flex-shrink:0}
.primary:disabled{background:#A9BEF5}
.secondary{height:48px;border:0;border-radius:14px;background:var(--bg);color:var(--ink2);font-size:15px;font-weight:700;flex-shrink:0}
.textbtn{border:0;background:transparent;color:var(--red);font-size:14px;font-weight:700;padding:8px;align-self:center}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select{height:50px;border:1px solid var(--line2);border-radius:12px;padding:0 14px;font-size:16px;background:#fff;color:var(--ink);width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick{display:flex;gap:6px}
.quick button{height:32px;padding:0 10px;border:1px solid var(--line2);border-radius:16px;background:#fff;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 150px);background:rgba(25,31,40,.92);color:#fff;font-size:14px;padding:12px 18px;border-radius:14px;z-index:50;max-width:calc(100% - 40px);text-align:center;animation:fade .15s}
.banner{font-size:12px;color:var(--warn);background:var(--warnbg);border-radius:12px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner button{border:0;background:transparent;color:var(--warn);font-weight:700;font-size:12px;padding:4px}
.empty{margin:0;padding:24px 0;text-align:center;font-size:14px;color:var(--mute)}
.spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--blue);border-radius:50%;animation:rot .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.noanim{animation:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<script>
'use strict';
/* =========================== 저장소 · 상태 =========================== */
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
var NOW = new Date();
var TODAY = ymd(NOW);
var S = {
  conf: LS.get('gb.conf', null),
  demo: false,
  data: null,
  syncedAt: '',
  loading: false,
  error: '',
  tab: 'home',
  ym: TODAY.slice(0, 7),
  sel: 0,
  filter: 'all',
  sortKey: 'date',
  sortDir: 'desc',
  q: '',
  searchOpen: false,
  pickerOpen: false,
  pickYear: NOW.getFullYear(),
  sheet: null,
  dismissed: LS.get('gb.dismissed', [])
};

/* =========================== 작은 도구 =========================== */
function p2(n) { n = Number(n); return n < 10 ? '0' + n : String(n); }
function ymd(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function fmt(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '-' : '') + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function won(n) { return fmt(n) + '원'; }
function num(v) { if (typeof v === 'number') return v; var s = String(v == null ? '' : v).replace(/[^0-9.-]/g, ''); return s ? Number(s) : 0; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function md(date) { return date.slice(5, 7) + '.' + date.slice(8, 10); }
function dotted(date) { return date.slice(0, 4) + '.' + md(date); }
var WK = ['일', '월', '화', '수', '목', '금', '토'];
function dow(date) { return new Date(+date.slice(0, 4), +date.slice(5, 7) - 1, +date.slice(8, 10)).getDay(); }
function daysIn(ym) { return new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate(); }
function shiftYM(ym, d) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) + d; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + p2(m); }
function isTrue(v) { return v === true || v === 'TRUE' || v === 'true'; }
function normWhen(s) {
  var m = String(s || '').match(/(\d{4})[-.](\d{1,2})[-.](\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/);
  if (!m) return TODAY + ' 00:00';
  return m[1] + '-' + p2(m[2]) + '-' + p2(m[3]) + ' ' + p2(m[4] || 0) + ':' + (m[5] || '00');
}
var ICON = {
  gear: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',
  home: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  list: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  wallet: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 14h2M3 10h18"/></svg>',
  target: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>',
  left: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
  right: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  search: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  plus: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  refresh: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>'
};

/* =========================== 데이터 해석 =========================== */
var CAT_BG = {
  '식비': '#FFF4EC', '카페': '#F8F1EA', '교통': '#EAF6F0', '쇼핑': '#EEF2FF', '생활': '#F3F0FF',
  '주거': '#E7F5FF', '통신': '#E7F5FF', '구독': '#E7F5FF', '보험': '#E7F5FF',
  '이체': '#F1F3F5', '저축': '#FFF0F6', '급여': '#E8EFFE', '기타 수입': '#E8EFFE', '확인 필요': '#FFF4E6', '취소': '#F1F3F5'
};
var ASSET_EMOJI = { '현금': '💵', '예금': '🏦', '적금': '🐷', '주식': '📈', '코인': '🪙', '연금': '🌱', '보험': '🛡️', '기타': '📦' };
function table(name) { return (S.data && S.data[name]) || []; }
function categories(kind) {
  return table('카테고리').filter(function (c) { return c['이름'] && (!kind || c['구분'] === kind); })
    .sort(function (a, b) { return num(a['정렬']) - num(b['정렬']); });
}
function catEmoji(name) {
  if (name === '이체') return '🔁';
  if (name === '저축') return '🐷';
  if (name === '확인 필요') return '❓';
  if (name === '취소') return '↩️';
  var c = table('카테고리').filter(function (x) { return x['이름'] === name; })[0];
  return c && c['이모지'] ? c['이모지'] : '💬';
}
function catBg(name) { return CAT_BG[name] || '#F1F3F5'; }
function assets() { return table('자산').filter(function (a) { return a.id && !isTrue(a['숨김']); }).sort(function (a, b) { return num(a['정렬']) - num(b['정렬']); }); }
function assetById(id) { return table('자산').filter(function (a) { return a.id === id; })[0]; }
function normTx(r) {
  var when = normWhen(r['거래일시']);
  var memo = String(r['메모'] || '');
  var t = {
    id: String(r.id), when: when, date: when.slice(0, 10), time: when.slice(11, 16), ym: when.slice(0, 7), day: +when.slice(8, 10),
    type: String(r['유형'] || '확인 필요'), amt: num(r['금액']), name: String(r['가맹점'] || ''), cat: String(r['카테고리'] || ''),
    reason: String(r['분류근거'] || ''), via: String(r['결제수단명'] || ''), payId: String(r['결제수단ID'] || ''),
    inst: num(r['할부개월']), instNo: num(r['할부회차']), link: String(r['연결거래ID'] || ''), assetId: String(r['자산ID'] || ''),
    memo: memo, auto: r['원본행'] !== '' && r['원본행'] != null, deleted: isTrue(r['삭제됨']),
    cum: r['알림누적금액'] === '' || r['알림누적금액'] == null ? null : num(r['알림누적금액'])
  };
  t.fullCanceled = /(^|\s)취소됨/.test(memo) && !/부분 취소됨/.test(memo);
  t.partCanceled = /부분 취소됨/.test(memo);
  t.partCancel = t.type === '취소' && /^부분 취소/.test(memo);
  return t;
}
function allTx() { return table('거래').map(normTx).filter(function (t) { return !t.deleted; }); }
function txById(id) { return allTx().filter(function (t) { return t.id === id; })[0]; }
/** 지출 합계에 들어가는 금액: 취소된 결제는 빼고, 부분 취소는 차감 */
function spendOf(t) {
  if ((t.type === '지출' || t.type === '확인 필요') && !t.fullCanceled) return t.amt;
  if (t.partCancel) return -t.amt;
  return 0;

function ledgerData() {
  var tx = allTx();
  var month = tx.filter(function (t) { return t.ym === S.ym; });
  var q = S.q.trim();
  var searching = !!q;
  function match(t) {
    var f = S.filter;
    if (f === 'income' && t.type !== '수입') return false;
    if (f === 'spend' && !(t.type === '지출' || t.type === '취소')) return false;
    if (f === 'transfer' && t.type !== '이체') return false;
    if (f === 'saving' && t.type !== '저축') return false;
    if (f === 'alert' && t.type !== '확인 필요') return false;
    if (searching) {
      var needle = q.replace(/\s/g, '').toLowerCase();
      var digits = q.replace(/[^0-9]/g, '');
      var hay = (t.name + t.via + t.cat + t.memo).replace(/\s/g, '').toLowerCase();
      if (!(hay.indexOf(needle) >= 0 || (digits.length >= 2 && String(t.amt).indexOf(digits) >= 0))) return false;
    }
    return true;
  }
  var pool = searching ? tx : month;   // 검색은 전체 기간에서
  var list = pool.filter(function (t) { return match(t) && (searching || !S.sel || t.day === S.sel); });
  var dir = S.sortDir === 'asc' ? 1 : -1;
  list.sort(function (a, b) { var v = S.sortKey === 'amount' ? a.amt - b.amt : (a.when < b.when ? -1 : a.when > b.when ? 1 : 0); return v * dir; });

    if (!items.length) return toast('바뀐 잔액을 하나 이상 넣어 주세요');
    S.page.busy = true; render();
    api('bulkAssets', { items: items }).then(function (j) { toast(j.updated + '개 자산을 업데이트했어요'); S.page = null; return load(true); })
      .catch(function (e) { S.page.busy = false; render(); toast('저장하지 못했어요: ' + (e.message || e)); });
  },
  editDebt: function (v) { var d = table('부채').filter(function (x) { return x.id === v; })[0]; S.sheet = { kind: 'debtForm', draft: Object.assign({}, d) }; renderSheet(); },
  dWay: function (v) { readDebtInputs(); S.sheet.draft['상환방식'] = v; renderSheet(); },
  saveDebt: function () {
    readDebtInputs();
    var d = S.sheet.draft;
    if (!String(d['이름'] || '').trim()) return toast('이름을 넣어 주세요');
    if (!d['원금']) return toast('대출 금액을 넣어 주세요');
    var row = { '이름': d['이름'].trim(), '원금': d['원금'], '금리': d['금리'] === '' ? '' : Number(d['금리']), '시작일': d['시작일'] || '', '종료일': d['종료일'] || '', '거치개월': d['거치개월'] === '' ? '' : num(d['거치개월']), '상환방식': d['상환방식'] || '', '상환일': d['상환일'] === '' ? '' : num(d['상환일']), '지출자동반영': !!d['지출자동반영'] };
    if (d.id) { row.id = d.id; row['현재잔액'] = d['현재잔액'] === '' ? d['원금'] : d['현재잔액']; } else row['현재잔액'] = d['원금'];
    busy(true);
    api('saveRow', { table: '부채', row: row }).then(function () { return done('저장했어요'); }).catch(fail);
  },
  delRow: function (v, el) {
    var t = el.getAttribute('data-t');
    if (!confirm('정말 삭제할까요? 시트에서도 지워져요.')) return;
    var key = t === '카테고리' ? { '이름': v } : { id: v };
    busy(true);
    api('deleteRow', { table: t, key: key }).then(function () { if (t === '자산' || t === '부채') S.page = null; return done('삭제했어요'); }).catch(fail);
  },
  period: function (v) { S.periodOff = (S.periodOff || 0) + +v; render(); },
  periodKind: function (v) { S.period = v; S.periodOff = 0; render(); },
  setPage: function (v) { S.setPage = v; window.scrollTo(0, 0); render(); },
  catEdit: function (v) { var c = table('카테고리').filter(function (x) { return x['이름'] === v; })[0]; S.sheet = { kind: 'cat', orig: v, draft: Object.assign({}, c) }; renderSheet(); },
  catNew: function (v) { S.sheet = { kind: 'cat', orig: '', draft: { '구분': v, '이모지': '💬', '정렬': nextSort('카테고리') } }; renderSheet(); },
  cEmoji: function (v) { var d = S.sheet.draft; if (val('cName') != null) d['이름'] = val('cName'); d['이모지'] = v; renderSheet(); },
  saveCat: function () {
    var sh = S.sheet, d = sh.draft; d['이름'] = (val('cName') || '').trim();
    if (!d['이름']) return toast('이름을 넣어 주세요');
    if (['이체', '저축', '취소', '확인 필요'].indexOf(d['이름']) >= 0) return toast('\'' + d['이름'] + '\'은(는) 앱에서 따로 쓰는 이름이라 쓸 수 없어요');
    if (d['이름'] !== sh.orig && table('카테고리').some(function (c) { return c['이름'] === d['이름']; })) return toast('같은 이름의 카테고리가 이미 있어요');
    busy(true);
    var p = { table: '카테고리', row: { '이름': d['이름'], '구분': d['구분'], '이모지': d['이모지'], '정렬': num(d['정렬']) || nextSort('카테고리') } };
    if (sh.orig) p.key = { '이름': sh.orig };
    api('saveRow', p).then(function () { return done('저장했어요'); }).catch(fail);
  },
  delRule: function (v, el) {
    var k = el.getAttribute('data-k');
    if (!confirm('\'' + v + '\' 규칙을 지울까요?')) return;
    api('deleteRow', { table: '분류규칙', key: { '종류': k, '패턴': v } }).then(function () { toast('지웠어요'); return load(true); }).catch(function (e) { toast('지우지 못했어요: ' + (e.message || e)); });
  },
  kwMore: function (v) { S.kwOpen = S.kwOpen || {}; S.kwOpen[v] = !S.kwOpen[v]; render(); },
  kwNew: function (v) { S.sheet = { kind: 'kw', cat: v }; renderSheet(); var i = document.getElementById('kwIn'); if (i) i.focus(); },
  saveKw: function () {
    var sh = S.sheet;
    var words = (val('kwIn') || '').split(',').map(function (w) { return w.trim(); }).filter(Boolean);
    if (!words.length) return toast('키워드를 넣어 주세요');
    busy(true);
    words.reduce(function (p, w) { return p.then(function () { return api('saveRow', { table: '분류규칙', row: { '종류': '키워드', '패턴': w, '카테고리': sh.cat, '메모': '앱에서 추가' } }); }); }, Promise.resolve())
      .then(function () { return done(words.length + '개 추가했어요 · 다음 알림부터 적용돼요'); }).catch(fail);
  },
  fixedEdit: function (v) { var f = table('고정항목').filter(function (x) { return x.id === v; })[0]; S.sheet = { kind: 'fixed', draft: Object.assign({}, f) }; renderSheet(); },
  fixedNew: function (v) { S.sheet = { kind: 'fixed', draft: { '구분': v, '주기': '매월', '금액': '' } }; renderSheet(); },
  xCat: function (v) { readFixedInputs(); S.sheet.draft['카테고리'] = v; renderSheet(); },
  saveFixed: function () {
    readFixedInputs();
    var d = S.sheet.draft;
    if (!String(d['이름'] || '').trim()) return toast('이름을 넣어 주세요');
    var row = { '구분': d['구분'], '이름': d['이름'].trim(), '카테고리': d['카테고리'] || '', '금액': d['금액'], '주기': d['주기'] || '매월', '결제일': d['결제일'] === '' ? '' : num(d['결제일']), '시작월': d['시작월'] || '', '종료월': d['종료월'] || '', '결제수단ID': d['결제수단ID'] || '', '메모': d['메모'] || '' };
    if (d.id) row.id = d.id;
    busy(true);
    api('saveRow', { table: '고정항목', row: row }).then(function () { return done('저장했어요'); }).catch(fail);
  },
  acctEdit: function (v) { var c = table('계좌카드').filter(function (x) { return x.id === v; })[0]; S.sheet = { kind: 'acct', draft: Object.assign({}, c) }; renderSheet(); },
  acctNew: function (v) { S.sheet = { kind: 'acct', draft: { '종류': v } }; renderSheet(); },
  saveAcct: function () {
    var d = S.sheet.draft;
    var row = { '종류': d['종류'], '이름': (val('yName') || '').trim(), '금융사': (val('yBank') || '').trim(), '끝4자리': (val('yLast4') || '').trim(), '알림앱': (val('yApp') || '').trim(), '메모': (val('yMemo') || '').trim() };
    if (!row['이름']) return toast('이름을 넣어 주세요');
    if (row['끝4자리'] && !/^\d{4}$/.test(row['끝4자리'])) return toast('끝 4자리는 숫자 4개로 넣어 주세요');
    if (d['종류'] === '카드') { row['결제일'] = val('yPayDay') === '' ? '' : num(val('yPayDay')); row['실적기준'] = val('yGoal') === '' ? '' : num(val('yGoal')); }
    else row['연결자산ID'] = val('yAsset') || '';
    if (d.id) row.id = d.id;
    busy(true);
    api('saveRow', { table: '계좌카드', row: row }).then(function () { return done('저장했어요'); }).catch(fail);
  }
});

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || el.tagName === 'INPUT') return;
  var fn = ACT[el.getAttribute('data-a')];
  if (fn) { e.preventDefault(); fn(el.getAttribute('data-v'), el); }
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && el.getAttribute('data-a')) ACT[el.getAttribute('data-a')](null, el);
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'q') {
    S.q = e.target.value;
    var main = document.getElementById('ledgerMain');
    if (main) main.innerHTML = ledgerBody(ledgerData());
  }
  if (['aAmt', 'fBal', 'dAmt', 'dBal', 'xAmt', 'yGoal'].indexOf(e.target.id) >= 0 || e.target.classList.contains('bulkIn')) {
    var n = num(e.target.value); e.target.value = e.target.value.trim() === '' ? '' : fmt(n);
    if (e.target.classList.contains('bulkIn') && S.page) S.page.vals[e.target.getAttribute('data-id')] = e.target.value === '' ? 0 : n;
  }
});
/* 아이폰에서 키보드가 닫힌 뒤 화면과 터치 위치가 어긋나는 문제 보정 */
document.addEventListener('focusout', function (e) {
  if (!/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  setTimeout(function () {
    var a = document.activeElement;
    if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return;
    window.scrollTo(window.scrollX, window.scrollY);
    var sh = document.querySelector('.sheet'); if (sh) sh.scrollTop = sh.scrollTop;
  }, 80);
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.sheet) { S.sheet = null; renderSheet(); } });
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.conf && !S.demo && !S.sheet) {
    NOW = new Date(); TODAY = ymd(NOW); load(true);
  }
});

/* =========================== 시작 =========================== */
(function start() {
  if (S.conf) {
    var c = LS.get('gb.cache', null);
    if (c) { S.data = c.data; S.syncedAt = c.time; }
    render(); load(true);
  } else render();
})();
</script>
</body>
</html>
